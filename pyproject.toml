[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idxlab"
version = "0.1.0"
description = "ML pipeline for Indonesian (IDX) stock signal prediction and backtesting"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "yfinance",
    "pyarrow",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["idxlab*"]