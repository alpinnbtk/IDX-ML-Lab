[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idxlab"
version = "0.1.0"
description = "ML pipeline for Indonesian (IDX) stock signal prediction and backtesting"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "yfinance",
    "pyarrow",
    "pyyaml",
    "python-dotenv",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "pandas-stubs", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["idxlab*"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true